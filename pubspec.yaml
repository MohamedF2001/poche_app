name: poche
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.5.2
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.1 # Mise à jour de intl
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  drawerbehavior: ^3.0.0
  toggle_switch: ^2.1.0
  font_awesome_flutter: ^10.5.0
  get: ^4.6.6
  flutter_slidable: ^3.0.0
  syncfusion_flutter_charts: ^28.2.11
  settings_ui: ^2.0.2
  shared_preferences: ^2.2.1
  flutter_local_notifications: ^18.0.1
  animated_text_kit: ^4.2.2
  image_picker: ^1.0.4
  url_launcher: ^6.1.14
  fl_chart: ^0.67.0
  radar_chart: ^2.1.0
  flutter_dotenv: ^5.0.2
  http: ^1.2.1
  flutter_speed_dial: ^6.1.0
  velocity_x: ^4.3.1 # Version compatible avec intl 0.20.1
  #dash_chat_2: ^0.0.20
  chat_gpt_sdk: ^2.2.5
  webview_flutter: ^4.7.0
  google_generative_ai: ^0.4.7
  google_fonts: ^6.3.2
  equatable: ^2.0.7
  dartz: ^0.10.1
  flutter_riverpod: ^2.4.9
  animations: ^2.1.1
  pdf: ^3.11.3
  printing: ^5.14.2
  excel: ^4.0.6
  share_plus: ^12.0.1
  universal_html: ^2.2.4
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0
  riverpod_annotation: ^2.3.5
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/images/spl_bottom.png
    - assets/images/spl_top.png
    - assets/images/appicon.png
    - assets/images/person_default.jpg

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
        - asset: assets/fonts/Poppins-Regular.ttf
